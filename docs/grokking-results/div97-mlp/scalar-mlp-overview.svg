<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="645" viewBox="0 0 1200 645" role="img" aria-labelledby="title description">
<title id="title">Scalar MLP overview</title><desc id="description">Input projection, repeated width-preserving blocks, a linear scalar readout, an unrounded MSE loss branch, and rounded accuracy evaluation. Representative tested widths and depths are shown with parameter counts.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526a80"/></marker>
  <marker id="skip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147967"/></marker>
</defs>
<rect width="1200" height="645" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><text x="38" y="47" font-size="31" fill="#142638" text-anchor="start" font-weight="700">Two scaled inputs → one scalar prediction</text><text x="38" y="84" font-size="20" fill="#526476" text-anchor="start" font-weight="400">D counts all ReLU hidden layers, including the first projection. W is hidden width.</text><rect x="38" y="146" width="145" height="104" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="110.5" y="190.5" font-size="21" fill="#142638" text-anchor="middle" font-weight="600">Inputs</text><text x="110.5" y="219.5" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">(aₛ, bₛ)</text><rect x="218" y="146" width="202" height="104" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="319" y="190.5" font-size="21" fill="#142638" text-anchor="middle" font-weight="600">Affine 2 → W</text><text x="319" y="219.5" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">ReLU</text><rect x="455" y="146" width="250" height="104" rx="12" fill="#f4effb" stroke="#7153a2" stroke-width="1.6"/><text x="580" y="177" font-size="20" fill="#142638" text-anchor="middle" font-weight="600">W → W block</text><text x="580" y="205" font-size="20" fill="#142638" text-anchor="middle" font-weight="400">repeat D − 1 times</text><text x="580" y="233" font-size="20" fill="#142638" text-anchor="middle" font-weight="400">choose A–D</text><rect x="740" y="146" width="205" height="104" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="842.5" y="190.5" font-size="21" fill="#142638" text-anchor="middle" font-weight="600">Affine W → 1</text><text x="842.5" y="219.5" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">linear output</text><rect x="980" y="146" width="182" height="104" rx="12" fill="#edf8f4" stroke="#147967" stroke-width="1.6"/><text x="1071" y="191" font-size="20" fill="#142638" text-anchor="middle" font-weight="600">Inverse scale</text><text x="1071" y="219" font-size="20" fill="#142638" text-anchor="middle" font-weight="400">round to integer</text><path d="M 183 198 L 212 198" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 420 198 L 449 198" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 705 198 L 734 198" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 945 198 L 974 198" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1071" y="281" font-size="19" fill="#147967" text-anchor="middle" font-weight="400">accuracy only</text><rect x="455" y="319" width="250" height="83" rx="12" fill="#f6f8fa" stroke="#cbd5df" stroke-width="1.6"/><text x="580" y="353.5" font-size="20" fill="#142638" text-anchor="middle" font-weight="600">Target cₛ</text><text x="580" y="381.5" font-size="20" fill="#142638" text-anchor="middle" font-weight="400">same numeric scale</text><rect x="740" y="319" width="205" height="83" rx="12" fill="#fff5e9" stroke="#a75b1e" stroke-width="1.6"/><text x="842.5" y="353.5" font-size="20" fill="#142638" text-anchor="middle" font-weight="600">MSE loss</text><text x="842.5" y="381.5" font-size="20" fill="#142638" text-anchor="middle" font-weight="400">before rounding</text><path d="M 705 360 L 734 360" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 842 250 L 842 313" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="453" width="263" height="122" rx="12" fill="#f7f9fc" stroke="#cbd5df"/><text x="169.5" y="486" font-size="25" fill="#142638" text-anchor="middle" font-weight="600">W128 × 4</text><text x="169.5" y="520" font-size="20" fill="#526476" text-anchor="middle" font-weight="400">50,049 parameters</text><text x="169.5" y="551" font-size="18" fill="#526476" text-anchor="middle" font-weight="400">matched depth control</text><rect x="325" y="453" width="263" height="122" rx="12" fill="#f7f9fc" stroke="#cbd5df"/><text x="456.5" y="486" font-size="25" fill="#142638" text-anchor="middle" font-weight="600">W128 × 8</text><text x="456.5" y="520" font-size="20" fill="#526476" text-anchor="middle" font-weight="400">116,097 parameters</text><text x="456.5" y="551" font-size="18" fill="#526476" text-anchor="middle" font-weight="400">optimization reference</text><rect x="612" y="453" width="263" height="122" rx="12" fill="#f7f9fc" stroke="#cbd5df"/><text x="743.5" y="486" font-size="25" fill="#142638" text-anchor="middle" font-weight="600">W256 × 8</text><text x="743.5" y="520" font-size="20" fill="#526476" text-anchor="middle" font-weight="400">461,569 parameters</text><text x="743.5" y="551" font-size="18" fill="#526476" text-anchor="middle" font-weight="400">best training recipe</text><rect x="899" y="453" width="263" height="122" rx="12" fill="#f7f9fc" stroke="#cbd5df"/><text x="1030.5" y="486" font-size="25" fill="#142638" text-anchor="middle" font-weight="600">W128 × 16</text><text x="1030.5" y="520" font-size="20" fill="#526476" text-anchor="middle" font-weight="400">248,193 parameters</text><text x="1030.5" y="551" font-size="18" fill="#526476" text-anchor="middle" font-weight="400">deep-grid family</text><text x="38" y="617" font-size="19" fill="#526476" text-anchor="start" font-weight="400">Trainable biases in every affine layer. No normalization or skip on the input projection or readout.</text></g>
</svg>
