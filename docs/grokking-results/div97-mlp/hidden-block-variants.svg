<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title description">
<title id="title">Scalar MLP hidden-block variants</title><desc id="description">Four panels show plain ReLU, pre-RMSNorm, residual ReLU, and pre-RMSNorm with residual. Residual arrows carry the original hidden state around the complete branch and merge after ReLU.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526a80"/></marker>
  <marker id="skip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147967"/></marker>
</defs>
<rect width="1200" height="940" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="46" font-size="31" fill="#142638" text-anchor="start" font-weight="700">Four hidden-block variants</text><text x="28" y="84" font-size="20" fill="#526476" text-anchor="start" font-weight="400">Each block preserves W features; each repeated layer has its own affine weights and bias.</text><rect x="28" y="118" width="558" height="358" rx="15" fill="#fbfcfe" stroke="#cbd5df" stroke-width="1.5"/><text x="52" y="157" font-size="23" fill="#142638" text-anchor="start" font-weight="600">A · Plain ReLU</text><text x="52" y="189" font-size="19" fill="#526476" text-anchor="start" font-weight="400">normalization off · skip off</text><text x="53" y="306" font-size="22" fill="#142638" text-anchor="middle" font-weight="400">h</text><rect x="129" y="262" width="208" height="74" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="233" y="291.5" font-size="21" fill="#142638" text-anchor="middle" font-weight="600">Affine W → W</text><text x="233" y="320.5" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">with bias</text><rect x="372" y="262" width="101" height="74" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="422.5" y="306" font-size="20" fill="#142638" text-anchor="middle" font-weight="600">ReLU</text><path d="M 67 299 L 123 299" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 343 299 L 366 299" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 479 299 L 550 299" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><text x="565" y="306" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">h′</text><text x="52" y="399" font-size="18" fill="#142638" text-anchor="start" font-weight="400">h_next = ReLU(A h + b)</text><text x="52" y="439" font-size="18" fill="#526476" text-anchor="start" font-weight="400">Only the branch becomes the next hidden state.</text><rect x="614" y="118" width="558" height="358" rx="15" fill="#fbfcfe" stroke="#cbd5df" stroke-width="1.5"/><text x="638" y="157" font-size="23" fill="#142638" text-anchor="start" font-weight="600">B · Pre-RMSNorm</text><text x="638" y="189" font-size="19" fill="#526476" text-anchor="start" font-weight="400">normalization on · skip off</text><text x="639" y="306" font-size="22" fill="#142638" text-anchor="middle" font-weight="400">h</text><rect x="676" y="262" width="115" height="74" rx="12" fill="#f4effb" stroke="#7153a2" stroke-width="1.6"/><text x="733.5" y="306" font-size="19" fill="#142638" text-anchor="middle" font-weight="600">RMSNorm</text><rect x="816" y="262" width="130" height="74" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="881" y="292" font-size="20" fill="#142638" text-anchor="middle" font-weight="600">Affine</text><text x="881" y="320" font-size="20" fill="#142638" text-anchor="middle" font-weight="400">W → W</text><rect x="971" y="262" width="88" height="74" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="1015" y="306" font-size="19" fill="#142638" text-anchor="middle" font-weight="600">ReLU</text><path d="M 653 299 L 670 299" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 797 299 L 810 299" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 952 299 L 965 299" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 1065 299 L 1136 299" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1151" y="306" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">h′</text><text x="638" y="399" font-size="18" fill="#142638" text-anchor="start" font-weight="400">h_next = ReLU(A RMSNorm(h) + b)</text><text x="638" y="439" font-size="18" fill="#526476" text-anchor="start" font-weight="400">Only the branch becomes the next hidden state.</text><rect x="28" y="507" width="558" height="358" rx="15" fill="#fbfcfe" stroke="#cbd5df" stroke-width="1.5"/><text x="52" y="546" font-size="23" fill="#142638" text-anchor="start" font-weight="600">C · Residual</text><text x="52" y="578" font-size="19" fill="#526476" text-anchor="start" font-weight="400">normalization off · skip on</text><text x="53" y="695" font-size="22" fill="#142638" text-anchor="middle" font-weight="400">h</text><rect x="129" y="651" width="208" height="74" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="233" y="680.5" font-size="21" fill="#142638" text-anchor="middle" font-weight="600">Affine W → W</text><text x="233" y="709.5" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">with bias</text><rect x="372" y="651" width="101" height="74" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="422.5" y="695" font-size="20" fill="#142638" text-anchor="middle" font-weight="600">ReLU</text><path d="M 67 688 L 123 688" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 343 688 L 366 688" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 479 688 L 490 688" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="515" cy="688" r="19" fill="#edf8f4" stroke="#147967" stroke-width="2"/><text x="515" y="696" font-size="29" fill="#147967" text-anchor="middle" font-weight="400">+</text><path d="M 540 688 L 550 688" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 73 688 L 73 618 L 515 618 L 515 663" fill="none" stroke="#147967" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#skip)"/><text x="299" y="610" font-size="18" fill="#147967" text-anchor="middle" font-weight="400">identity</text><text x="565" y="695" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">h′</text><text x="52" y="788" font-size="18" fill="#142638" text-anchor="start" font-weight="400">h_next = h + ReLU(A h + b)</text><text x="52" y="828" font-size="18" fill="#526476" text-anchor="start" font-weight="400">Skip carries h before any normalization.</text><rect x="614" y="507" width="558" height="358" rx="15" fill="#fbfcfe" stroke="#cbd5df" stroke-width="1.5"/><text x="638" y="546" font-size="23" fill="#142638" text-anchor="start" font-weight="600">D · Pre-RMSNorm + residual</text><text x="638" y="578" font-size="19" fill="#526476" text-anchor="start" font-weight="400">normalization on · skip on</text><text x="639" y="695" font-size="22" fill="#142638" text-anchor="middle" font-weight="400">h</text><rect x="676" y="651" width="115" height="74" rx="12" fill="#f4effb" stroke="#7153a2" stroke-width="1.6"/><text x="733.5" y="695" font-size="19" fill="#142638" text-anchor="middle" font-weight="600">RMSNorm</text><rect x="816" y="651" width="130" height="74" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="881" y="681" font-size="20" fill="#142638" text-anchor="middle" font-weight="600">Affine</text><text x="881" y="709" font-size="20" fill="#142638" text-anchor="middle" font-weight="400">W → W</text><rect x="971" y="651" width="88" height="74" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="1015" y="695" font-size="19" fill="#142638" text-anchor="middle" font-weight="600">ReLU</text><path d="M 653 688 L 670 688" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 797 688 L 810 688" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 952 688 L 965 688" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 1065 688 L 1076 688" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="1101" cy="688" r="19" fill="#edf8f4" stroke="#147967" stroke-width="2"/><text x="1101" y="696" font-size="29" fill="#147967" text-anchor="middle" font-weight="400">+</text><path d="M 1126 688 L 1136 688" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 659 688 L 659 618 L 1101 618 L 1101 663" fill="none" stroke="#147967" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#skip)"/><text x="885" y="610" font-size="18" fill="#147967" text-anchor="middle" font-weight="400">identity</text><text x="1151" y="695" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">h′</text><text x="638" y="788" font-size="18" fill="#142638" text-anchor="start" font-weight="400">h_next = h + ReLU(A RMSNorm(h) + b)</text><text x="638" y="828" font-size="18" fill="#526476" text-anchor="start" font-weight="400">Skip carries h before any normalization.</text><text x="28" y="911" font-size="19" fill="#526476" text-anchor="start" font-weight="400">RMSNorm: epsilon 10⁻⁵; no learned gain or bias. D = 1 has no eligible block and uses one common baseline.</text></g>
</svg>
