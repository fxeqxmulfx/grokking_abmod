<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
<title id="title">MLP input and target normalization</title><desc id="description">Three rows show raw, unit-scaled and centered operands and training targets. Unit scaling divides both inputs and the target by 96; centering also subtracts 0.5. The inverse output transform restores residue units before rounding for accuracy.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526a80"/></marker>
  <marker id="skip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147967"/></marker>
</defs>
<rect width="1200" height="630" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="46" font-size="31" fill="#142638" text-anchor="start" font-weight="700">Input and target normalization</text><text x="28" y="83" font-size="20" fill="#526476" text-anchor="start" font-weight="400">Same fixed transform for both operands and the target. The scalar readout remains linear.</text><rect x="28" y="111" width="1144" height="139" rx="14" fill="#fbfcfe" stroke="#cbd5df"/><text x="48" y="140" font-size="23" fill="#142638" text-anchor="start" font-weight="600">Raw</text><rect x="48" y="158" width="430" height="75" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="263" y="188.5" font-size="20" fill="#142638" text-anchor="middle" font-weight="600">Inputs: (a, b)</text><text x="263" y="216.5" font-size="20" fill="#142638" text-anchor="middle" font-weight="400">Target: c</text><rect x="523" y="158" width="205" height="75" rx="12" fill="#f4effb" stroke="#7153a2" stroke-width="1.6"/><text x="625.5" y="188" font-size="21" fill="#142638" text-anchor="middle" font-weight="600">MLP output ŷ</text><text x="625.5" y="217" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">unbounded</text><rect x="775" y="158" width="370" height="75" rx="12" fill="#edf8f4" stroke="#147967" stroke-width="1.6"/><text x="960" y="188" font-size="21" fill="#142638" text-anchor="middle" font-weight="600">Restore: ŷ</text><text x="960" y="217" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">then round for accuracy</text><path d="M 484 195.5 L 517 195.5" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 734 195.5 L 769 195.5" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="266" width="1144" height="139" rx="14" fill="#fbfcfe" stroke="#cbd5df"/><text x="48" y="295" font-size="23" fill="#142638" text-anchor="start" font-weight="600">Unit · divide by 96</text><rect x="48" y="313" width="430" height="75" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="263" y="343.5" font-size="20" fill="#142638" text-anchor="middle" font-weight="600">Inputs: (a/96, b/96)</text><text x="263" y="371.5" font-size="20" fill="#142638" text-anchor="middle" font-weight="400">Target: c/96</text><rect x="523" y="313" width="205" height="75" rx="12" fill="#f4effb" stroke="#7153a2" stroke-width="1.6"/><text x="625.5" y="343" font-size="21" fill="#142638" text-anchor="middle" font-weight="600">MLP output ŷ</text><text x="625.5" y="372" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">unbounded</text><rect x="775" y="313" width="370" height="75" rx="12" fill="#edf8f4" stroke="#147967" stroke-width="1.6"/><text x="960" y="343" font-size="21" fill="#142638" text-anchor="middle" font-weight="600">Restore: 96 ŷ</text><text x="960" y="372" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">then round for accuracy</text><path d="M 484 350.5 L 517 350.5" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 734 350.5 L 769 350.5" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="421" width="1144" height="139" rx="14" fill="#fbfcfe" stroke="#cbd5df"/><text x="48" y="450" font-size="23" fill="#142638" text-anchor="start" font-weight="600">Centered · divide by 96, subtract 0.5</text><rect x="48" y="468" width="430" height="75" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="263" y="498.5" font-size="20" fill="#142638" text-anchor="middle" font-weight="600">Inputs: (a/96 − 0.5, b/96 − 0.5)</text><text x="263" y="526.5" font-size="20" fill="#142638" text-anchor="middle" font-weight="400">Target: c/96 − 0.5</text><rect x="523" y="468" width="205" height="75" rx="12" fill="#f4effb" stroke="#7153a2" stroke-width="1.6"/><text x="625.5" y="498" font-size="21" fill="#142638" text-anchor="middle" font-weight="600">MLP output ŷ</text><text x="625.5" y="527" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">unbounded</text><rect x="775" y="468" width="370" height="75" rx="12" fill="#edf8f4" stroke="#147967" stroke-width="1.6"/><text x="960" y="498" font-size="21" fill="#142638" text-anchor="middle" font-weight="600">Restore: 96 (ŷ + 0.5)</text><text x="960" y="527" font-size="21" fill="#142638" text-anchor="middle" font-weight="400">then round for accuracy</text><path d="M 484 505.5 L 517 505.5" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 734 505.5 L 769 505.5" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/><text x="28" y="602" font-size="20" fill="#526476" text-anchor="start" font-weight="400">MSE uses the unrounded output ŷ and the transformed target, before inverse scaling.</text></g>
</svg>
