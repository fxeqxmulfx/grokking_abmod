<title id="title">Архитектура модели Rotate90</title><desc id="description">Rotate90 выбирает один из 97 классов q по (a,b). Общая E задаёт эмбеддинги обоих операндов и читает ответ. x₀ = E[a] + Rotate90(E[b]); r = RMSNorm(x₀); MatMul: z = r · A, (1 × W) · (W × W) → 1 × W; ∀c ∈ {0,…,W−1}: z[c] = ∑ᵢ r[i]A[i,c]; x₁ = x₀ + ReLU(z); logits = RMSNorm(x₁) · Eᵀ; q̂ = min argmax(logits).</desc>
