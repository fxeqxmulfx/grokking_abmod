<title id="title">Rotate90モデルの構造</title><desc id="description">Rotate90は (a,b) から97クラスのqを予測します。共有Eが両方のオペランドを埋め込み、答えの出力にも使われます。 x₀ = E[a] + Rotate90(E[b]); r = RMSNorm(x₀); MatMul: z = r · A, (1 × W) · (W × W) → 1 × W; ∀c ∈ {0,…,W−1}: z[c] = ∑ᵢ r[i]A[i,c]; x₁ = x₀ + ReLU(z); logits = RMSNorm(x₁) · Eᵀ; q̂ = min argmax(logits).</desc>
